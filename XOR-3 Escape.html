<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>XOR-3 Escape</title>
<style>
:root{--bg:#0b1020;--ink:#dff3ff;--dim:#7d93ad;--on:#ffb454;--cy:#5ee6e0;--b:0px;--c:1.05;--s:1.1;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1020}}
:root[data-theme="dark"]{--bg:#0b1020}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font:13px/1.45 ui-monospace,Menlo,Consolas,monospace;overflow:hidden}
#cv{position:fixed;inset:0;width:100%;height:100%;filter:url(#sharp) contrast(var(--c)) saturate(var(--s)) blur(var(--b))}
body.nofx #cv{filter:none}body.nofx .fx{display:none}
.fx{position:fixed;inset:0;pointer-events:none}
#vig{background:radial-gradient(ellipse at center,transparent 55%,rgba(5,8,20,.75))}
#scan{background:repeating-linear-gradient(0deg,rgba(255,255,255,.035) 0 1px,transparent 1px 3px);mix-blend-mode:overlay}
#bloom{background:linear-gradient(160deg,rgba(94,230,224,.1),transparent 40%,rgba(255,180,84,.1));mix-blend-mode:screen}
#hud{position:fixed;left:12px;top:calc(12px + env(safe-area-inset-top,0px));background:rgba(8,12,26,.74);padding:10px 12px;border:1px solid #234a63;max-width:min(310px,72vw)}
#hud b{color:var(--cy);font-weight:600}#hud i{color:var(--on);font-style:normal}
#spark{display:block;margin-top:6px;width:100%;height:28px}
#help{position:fixed;left:0;right:0;bottom:calc(8px + env(safe-area-inset-bottom,0px));text-align:center;color:var(--dim);padding:0 10px}
#msg{position:fixed;left:50%;top:18%;transform:translateX(-50%);padding:8px 14px;background:rgba(8,12,26,.85);border:1px solid var(--cy);opacity:0;transition:opacity .25s;max-width:80vw;text-align:center}
#cam{display:none;position:fixed;right:12px;bottom:44px;width:120px;transform:scaleX(-1);border:1px solid var(--cy)}
</style></head><body>
<svg width="0" height="0" style="position:absolute"><filter id="sharp"><feConvolveMatrix order="3" kernelMatrix="0 -.5 0 -.5 3 -.5 0 -.5 0" preserveAlpha="true"/></filter></svg>
<canvas id="cv"></canvas>
<div class="fx" id="bloom"></div><div class="fx" id="scan"></div><div class="fx" id="vig"></div>
<div id="hud"><div id="t"></div><canvas id="spark" width="150" height="28"></canvas></div>
<div id="msg"></div><video id="cam" muted playsinline></video>
<div id="help">A/D W/S mover · Espacio saltar · Q/E dimensión w · F interruptor · Tab IA · Shift control manual · T entrenar · C cara · V efectos · X reiniciar red · R reiniciar nivel</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ---------- Tablas matemáticas (LUT) ----------
const TAU=Math.PI*2,N=1024,SIN=new Float32Array(N+1),SIG=new Float32Array(N+1);
for(let i=0;i<=N;i++){SIN[i]=Math.sin(i/N*TAU);SIG[i]=1/(1+Math.exp(-(i/N*16-8)))}
const sin=a=>{let t=a/TAU*N;t-=Math.floor(t/N)*N;const i=t|0,f=t-i;return SIN[i]+(SIN[i+1]-SIN[i])*f};
const cos=a=>sin(a+1.5707963);
const sig=x=>{if(x<=-8)return 0;if(x>=8)return 1;const t=(x+8)*(N/16),i=t|0,f=t-i;return SIG[i]+(SIG[i+1]-SIG[i])*f};
const clamp=(v,a=-1,b=1)=>v<a?a:v>b?b:v;

// ---------- MLP desde cero con tablas estilo Lua (índices desde 1) ----------
const NI=3,NH=6,T=(n,f)=>{const t=[];for(let i=1;i<=n;i++)t[i]=f?f(i):0;return t};
const rnd=()=>(Math.random()*2-1)*1.8,H=T(NH);
let W1,B1,W2,b2,epochs=0,loss=.7;
function initNet(){W1=T(NH,()=>T(NI,rnd));B1=T(NH,rnd);W2=T(NH,rnd);b2=0;epochs=0;loss=.7}
const DATA=[];for(let k=0;k<8;k++){const a=k&1,b=k>>1&1,c=k>>2&1;DATA[k+1]={x:[0,a,b,c],t:(a+b+c)&1}}
function fwd(x){let o=b2;for(let j=1;j<=NH;j++){let z=B1[j];for(let i=1;i<=NI;i++)z+=W1[j][i]*x[i];H[j]=sig(z);o+=W2[j]*H[j]}return sig(o)}
function epoch(lr){let L=0;for(let k=1;k<=8;k++){const d=DATA[k],y=fwd(d.x),e=y-d.t;L-=d.t?Math.log(y+1e-6):Math.log(1-y+1e-6);
 for(let j=1;j<=NH;j++){const g=e*W2[j]*H[j]*(1-H[j]);W2[j]-=lr*e*H[j];B1[j]-=lr*g;for(let i=1;i<=NI;i++)W1[j][i]-=lr*g*d.x[i]}b2-=lr*e}
 epochs++;return L/8}
const burst=n=>{for(let i=0;i<n;i++)loss=epoch(.5)};

// ---------- Filtros IIR + FIR (FIIR) y buffers circulares preasignados ----------
class Filt{constructor(a,n){this.a=a;this.v=0;this.b=new Float32Array(n);this.i=0;this.n=n}
 iir(x){return this.v+=this.a*(x-this.v)}
 fir(x){this.b[this.i++%this.n]=x;let s=0;for(let k=0;k<this.n;k++)s+=this.b[k];return s/this.n}
 step(x){return this.fir(this.iir(x))}}
const LR=new Float32Array(128);let lri=0;

// ---------- Escena ----------
const cv=document.getElementById('cv'),vid=document.getElementById('cam'),R=new THREE.WebGLRenderer({canvas:cv,antialias:false});
const sc=new THREE.Scene();sc.background=new THREE.Color(0x0b1020);sc.fog=new THREE.Fog(0x0b1020,18,60);
const cm=new THREE.PerspectiveCamera(55,1,.1,120);
sc.add(new THREE.AmbientLight(0x7a8fb8,.9));const dl=new THREE.DirectionalLight(0xffffff,.8);dl.position.set(5,12,8);sc.add(dl);
const COL=[0x2c6f8f,0x7a5fb8,0xc25b8c,0xc28a3c].map(c=>new THREE.Color(c));
const BG=new THREE.BoxGeometry(2.4,.4,2.4),PM=[];   // pool de 16 plataformas reutilizables
for(let i=0;i<16;i++){const m=new THREE.Mesh(BG,new THREE.MeshLambertMaterial({color:0x2c6f8f,transparent:true}));m.visible=false;sc.add(m);PM.push(m)}
const SM=[null],CG=new THREE.CylinderGeometry(.6,.6,.12,16);
for(let k=1;k<=3;k++){const m=new THREE.Mesh(CG,new THREE.MeshLambertMaterial({color:0x334455,emissive:0}));sc.add(m);SM[k]=m}
const DM=new THREE.Mesh(new THREE.BoxGeometry(1.6,2.6,.2),new THREE.MeshLambertMaterial({color:0xff4f6a,transparent:true,opacity:.55}));sc.add(DM);
const AV=new THREE.Mesh(new THREE.SphereGeometry(.4,16,12),new THREE.MeshLambertMaterial({color:0xffb454,emissive:0x442200}));sc.add(AV);
const surf=(x,z,A)=>A*(.0015*(x-28)*(x-28)+.7*sin(x*.5)*cos(z*.6));
const FG=new THREE.PlaneGeometry(80,24,64,20);FG.rotateX(-Math.PI/2);const FP=FG.attributes.position;
const FM=new THREE.Mesh(FG,new THREE.MeshBasicMaterial({color:0x1f5a73,wireframe:true,transparent:true,opacity:.55}));FM.position.x=28;sc.add(FM);
const GB=new THREE.Mesh(new THREE.SphereGeometry(.35,10,8),new THREE.MeshBasicMaterial({color:0xff4fa3}));sc.add(GB);
let gx=0,gz=0,gt=0,landA=0;
function landscape(){landA=.4+lv*.25+loss*2;for(let i=0;i<FP.count;i++)FP.setY(i,-7+surf(FP.getX(i)+28,FP.getZ(i),landA));FP.needsUpdate=true}

// ---------- Nivel ----------
let lv=1,plats=[],sw=[0,0,0,0],wT=0,wC=0,standIdx=0,lastIdx=0,ai=false;
const SWI=[2,5,8],DOOR=11,pl={x:0,y:0,z:0,vx:0,vy:0,vz:0},isOpen=()=>(sw[1]+sw[2]+sw[3])&1;
function startLevel(){
 const sp=Math.min(4.5,3.5+lv*.2),amp=Math.min(1,lv*.25)*.9,zz=Math.min(1.2,lv*.4);plats.length=0;
 for(let i=0;i<PM.length;i++)PM[i].visible=i<12;
 for(let i=0;i<12;i++){const p={x:i*sp,y:amp*sin(i*1.1),z:zz*sin(i*1.7),w:Math.floor(i/3),m:PM[i]};p.m.position.set(p.x,p.y,p.z);plats.push(p)}
 for(let k=1;k<=3;k++){const p=plats[SWI[k-1]];SM[k].position.set(p.x,p.y+.26,p.z)}
 const d=plats[DOOR];DM.position.set(d.x,d.y+1.5,d.z);
 sw=[0,0,0,0];wT=wC=0;lastIdx=standIdx=0;Object.assign(pl,{x:0,y:plats[0].y+.2,z:plats[0].z,vx:0,vy:0,vz:0});
 landscape();say('Nivel '+lv+': deja un número impar de interruptores activos y cruza la puerta')}
const msg=document.getElementById('msg');let mt=0;
function say(t){msg.textContent=t;msg.style.opacity=1;clearTimeout(mt);mt=setTimeout(()=>msg.style.opacity=0,3500)}
function interact(){const k=SWI.indexOf(standIdx)+1;if(standIdx>=0&&k>0)sw[k]^=1}

// ---------- Cara: calibración ligera por centroide de piel ----------
const FC={on:false,cal:0,cx0:.5,cy0:.5,lean:0,nod:false,fx:new Filt(.3,6),fy:new Filt(.3,6),acc:[0,0,0]};
const fcv=document.createElement('canvas');fcv.width=32;fcv.height=24;const fctx=fcv.getContext('2d',{willReadFrequently:true});
async function calib(){
 if(!FC.on){try{vid.srcObject=await navigator.mediaDevices.getUserMedia({video:{width:160,height:120}});await vid.play();FC.on=true;vid.style.display='block'}
  catch(e){say('Cámara no disponible: usa el teclado');return}}
 FC.cal=2;FC.acc=[0,0,0];say('Calibrando: mira al frente sin moverte (2 s)')}
function faceStep(dt){
 if(!FC.on)return;fctx.drawImage(vid,0,0,32,24);const d=fctx.getImageData(0,0,32,24).data;let n=0,sx=0,sy=0;
 for(let i=0;i<d.length;i+=4){const r=d[i],g=d[i+1],b=d[i+2],y=.299*r+.587*g+.114*b,cb=128-.1687*r-.3313*g+.5*b,cr=128+.5*r-.4187*g-.0813*b;
  if(cb>77&&cb<127&&cr>133&&cr<173&&y>40){const p=i>>2;sx+=p%32;sy+=(p/32)|0;n++}}
 if(n<8)return;const cx=FC.fx.step(sx/n/32),cy=FC.fy.step(sy/n/24);
 if(FC.cal>0){FC.cal-=dt;FC.acc[0]+=cx;FC.acc[1]+=cy;FC.acc[2]++;
  if(FC.cal<=0){FC.cx0=FC.acc[0]/FC.acc[2];FC.cy0=FC.acc[1]/FC.acc[2];say('Cara calibrada: inclínate para moverte, asiente para saltar')}return}
 const l=clamp(-(cx-FC.cx0)*8);FC.lean=Math.abs(l)<.25?0:l;FC.nod=cy-FC.cy0>.07}

// ---------- Entrada y autopiloto ----------
const K={};
addEventListener('keydown',e=>{const k=e.key.toLowerCase();if(!K[k])press(k);K[k]=1;if([' ','tab','arrowup','arrowdown','arrowleft','arrowright'].includes(k))e.preventDefault()});
addEventListener('keyup',e=>{K[e.key.toLowerCase()]=0});
function press(k){if(k==='q')wT=Math.max(0,wT-1);if(k==='e')wT=Math.min(3,wT+1);if(k==='tab')ai=!ai;if(k==='t')burst(300);if(k==='r')startLevel();
 if(k==='c')calib();if(k==='f')interact();if(k==='v')document.body.classList.toggle('nofx');if(k==='x')initNet()}
let stall=0,cool=0;
function aiTarget(){if(fwd(sw)>.5)return DOOR;let b=1,bv=-1;
 for(let k=1;k<=3;k++){const s=[0,sw[1],sw[2],sw[3]];s[k]^=1;const v=fwd(s);if(v>bv){bv=v;b=k}}return SWI[b-1]}
function aiStep(dt){
 const cur=standIdx>=0?standIdx:lastIdx,tg=aiTarget();let mx=0,mz=0,jp=false;cool-=dt;
 if(cur===tg){const C=plats[cur];wT=C.w;mx=C.x-pl.x;mz=C.z-pl.z;
  if(standIdx>=0){if(tg===DOOR){if(!isOpen()){stall+=dt;if(stall>1.5){burst(400);stall=0;say('La IA falló: reentrena su red')}}}
   else if(cool<=0){interact();cool=.6}}}
 else{stall=0;const C=plats[cur],P=plats[cur+Math.sign(tg-cur)];mx=P.x-pl.x;mz=P.z-pl.z;
  if(standIdx>=0&&(pl.x-C.x)*Math.sign(P.x-C.x)>.9){jp=true;wT=P.w}}
 return[clamp(mx*2),clamp(mz*2),jp]}

// ---------- Física ----------
function physics(dt,mx,mz,jump){
 const a=Math.min(1,dt*10);pl.vx+=(mx*5-pl.vx)*a;pl.vz+=(mz*5-pl.vz)*a;
 const py=pl.y;pl.x+=pl.vx*dt;pl.z+=pl.vz*dt;pl.vy-=22*dt;pl.y+=pl.vy*dt;let st=-1;
 for(let i=0;i<plats.length;i++){const p=plats[i];if(Math.abs(p.w-wC)>.3)continue;const top=p.y+.2;
  if(Math.abs(pl.x-p.x)<1.35&&Math.abs(pl.z-p.z)<1.35&&pl.vy<=0&&py>=top-.15&&pl.y<=top){pl.y=top;pl.vy=0;st=i;break}}
 if(st>=0&&jump){pl.vy=9.5;st=-1}
 standIdx=st;if(st>=0)lastIdx=st;
 if(pl.y<-9){const p=plats[lastIdx];wT=wC=p.w;Object.assign(pl,{x:p.x,y:p.y+.2,z:p.z,vx:0,vy:0,vz:0})}}

// ---------- Resolución adaptativa ----------
let res=1,applied=1,ema=16;
function fit(){const w=innerWidth,h=innerHeight;R.setPixelRatio(Math.min(devicePixelRatio,1.5)*res);R.setSize(w,h,false);cm.aspect=w/h;cm.updateProjectionMatrix()}
addEventListener('resize',fit);

// ---------- Bucle ----------
const hud=document.getElementById('t'),sp=document.getElementById('spark').getContext('2d'),root=document.documentElement.style;
let last=performance.now(),fr=0;
function loop(t){requestAnimationFrame(loop);const dt=Math.min(.04,(t-last)/1000||.016);last=t;fr++;
 for(let i=0;i<4;i++)loss=epoch(.5);LR[lri++&127]=loss;
 faceStep(dt);
 let mx=(K.d||K.arrowright?1:0)-(K.a||K.arrowleft?1:0)+FC.lean,mz=(K.s||K.arrowdown?1:0)-(K.w||K.arrowup?1:0),jp=!!K[' ']||FC.nod;
 if(ai&&!K.shift)[mx,mz,jp]=aiStep(dt);
 wC+=(wT-wC)*Math.min(1,dt*9);
 physics(dt,clamp(mx),mz,jp);
 if(standIdx===DOOR&&isOpen()){lv++;startLevel()}
 for(const p of plats){const d=Math.abs(p.w-wC),mt=p.m.material;mt.opacity=d<.3?1:Math.max(.08,.45-d*.2);mt.color.copy(COL[p.w])}
 for(let k=1;k<=3;k++)SM[k].material.emissive.setHex(sw[k]?0xffb454:0);
 DM.material.color.setHex(isOpen()?0x5ee6e0:0xff4f6a);DM.material.opacity=isOpen()?.2:.55;
 AV.position.set(pl.x,pl.y+.4,pl.z);
 gt+=dt;if(gt>3){gt=0;gx=Math.random()*70-10;gz=Math.random()*20-10}
 const e=.3;gx-=.8*(surf(gx+e,gz,landA)-surf(gx-e,gz,landA))/(2*e);gz-=.8*(surf(gx,gz+e,landA)-surf(gx,gz-e,landA))/(2*e);
 GB.position.set(gx,-6.7+surf(gx,gz,landA),gz);
 cm.position.x+=(pl.x+1-cm.position.x)*.08;cm.position.y+=(pl.y+5.5-cm.position.y)*.08;cm.position.z+=(pl.z+11-cm.position.z)*.08;cm.lookAt(pl.x+2,pl.y+.5,pl.z);
 ema+=(dt*1000-ema)*.05;const spd=Math.hypot(pl.vx,pl.vz)+Math.abs(pl.vy)*.3;
 res+=(clamp(1.05-Math.max(0,ema-20)*.03-spd*.025,.5,1)-res)*.05;if(Math.abs(res-applied)>.06){applied=res;fit()}
 if(fr%30===0)landscape();
 if(fr%6===0){
  root.setProperty('--b',Math.min(2.2,loss*3).toFixed(2)+'px');root.setProperty('--c',(1.02+Math.min(.2,loss*.2)).toFixed(2));root.setProperty('--s',(1.25-Math.min(.3,loss*.4)).toFixed(2));
  const o=fwd(sw),truth=isOpen();
  hud.innerHTML='Nivel <b>'+lv+'</b> · '+(ai&&!K.shift?'<i>IA</i>':'manual')+' · slice w <b>'+Math.round(wT)+'</b><br>Interruptores x y z: <b>'+sw[1]+' '+sw[2]+' '+sw[3]+'</b> · puerta '+(truth?'<i>abierta</i>':'cerrada')+
   '<br>Red predice <b>'+o.toFixed(2)+'</b> · real '+truth+'<br>Pérdida <b>'+loss.toFixed(3)+'</b> · épocas '+epochs+'<br>Res '+res.toFixed(2)+' · pool 12/16 · LUT '+N+(FC.on?'<br>Cara: '+(FC.cal>0?'calibrando':'activa'):'');
  sp.clearRect(0,0,150,28);sp.strokeStyle='#5ee6e0';sp.beginPath();
  for(let i=0;i<128;i++){const v=LR[(lri+i)&127],x=i*150/127,y=27-clamp(v/1.2,0,1)*26;i?sp.lineTo(x,y):sp.moveTo(x,y)}sp.stroke()}
 R.render(sc,cm)}
initNet();startLevel();fit();requestAnimationFrame(loop);
</script></body></html>
